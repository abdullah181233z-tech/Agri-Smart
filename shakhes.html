<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>شخص نباتك</title>
    <link rel="stylesheet" href="shakhes.css">

</head>

<body>

    <!-- مكان الهيدر -->
    <div id="header"></div>


    <!-- محتوى الصفحة -->
    <main>
        <div class="shakhes">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sprout preview-icon"><path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/></svg>
            <h2> تشخيص النبات بالصور</h2>
            <p>ارفع صورة واضحة للجزاء المصاب وسيعرض النظام تحليلاً أولياً للمشكلة وخطوات مقترحة للتعامل معها.</p>
        </div>
        <div class="add-nat">
            <div class="add">
                <h3>صورة المحصول</h3>
                <div class="add-foto">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-from-line preview-icon"><path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/></svg>
                    <h4>اضف الصورة هنا او اضغط للاختيار</h4>
                    <p>لنتيجة اوضح , صور الورقة في إضاءة طبيعية</p>
                    <button>تحليل الصورة</button>
                </div>
            </div>

            <div class="nat">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-leaf preview-icon"><path d="M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20"/><path d="M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13"/></svg>
                <h4>نتيجة التحليل ستظهر هنا</h4>
                <p>ارفع صوره واضحة ثم اضغط علي "تحليل الصورة" لمشاهدة نوذج النتيجة</p>
            </div>
        </div>
    </main>

    <!-- مكان الفوتر -->
    <div id="footer"></div>
    <script src="main.js"></script>


</body>
</html>
